<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1"/>
<title>Oleaje · Punto de Venta</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{
  --sand:#c8a96e;
  --sand-light:#dfc090;
  --sand-pale:rgba(200,169,110,0.12);
  --cream:#f5f0e8;
  --cream-dark:#ede6d8;
  --dark:#1a1510;
  --dark-mid:#2d2419;
  --text:#3a2e22;
  --gray:#8a7a6a;
  --gray-mid:#bfb4a6;
  --border:rgba(58,46,34,0.12);
  --border-strong:rgba(200,169,110,0.35);
  --success:#4a7c59;
  --warning:#b8720a;
  --danger:#9b2335;
  --success-bg:rgba(74,124,89,0.1);
  --danger-bg:rgba(155,35,53,0.1);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Montserrat',sans-serif;background:var(--cream);color:var(--text);min-height:100vh;font-size:14px;-webkit-font-smoothing:antialiased;}
button{cursor:pointer;font-family:'Montserrat',sans-serif;}
input{font-family:'Montserrat',sans-serif;}

/* ── PANTALLA DE PIN ── */
#lockScreen{position:fixed;inset:0;background:var(--dark);display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:1000;}
.lock-logo h1{font-family:'Cormorant Garamond',serif;font-size:34px;font-weight:300;letter-spacing:0.35em;color:var(--cream);text-transform:uppercase;text-align:center;}
.lock-logo p{font-size:10px;letter-spacing:0.4em;color:var(--sand);margin-top:8px;text-transform:uppercase;font-weight:500;text-align:center;}
.lock-divider{width:44px;height:1px;background:var(--sand);margin:28px auto 32px;opacity:0.5;}
.lock-box{width:100%;max-width:300px;padding:0 24px;}
.pin-input{width:100%;background:rgba(255,255,255,0.05);border:1px solid rgba(200,169,110,0.25);border-radius:3px;padding:16px;font-size:22px;letter-spacing:0.4em;color:var(--cream);outline:none;text-align:center;transition:border-color 0.2s;}
.pin-input:focus{border-color:var(--sand);}
.pin-btn{width:100%;background:var(--sand);color:var(--dark);padding:15px;font-size:11px;font-weight:700;letter-spacing:0.2em;text-transform:uppercase;border:none;border-radius:3px;margin-top:14px;transition:background 0.2s;}
.pin-btn:hover{background:var(--sand-light);}
.pin-error{color:#e08a8a;font-size:11px;text-align:center;margin-top:14px;display:none;letter-spacing:0.02em;}

/* ── APP PRINCIPAL ── */
#app{display:none;min-height:100vh;flex-direction:column;}
.pos-header{background:var(--dark);padding:18px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;}
.pos-brand h1{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:300;color:var(--cream);letter-spacing:0.3em;text-transform:uppercase;}
.pos-brand p{font-size:9px;letter-spacing:0.3em;color:var(--sand);margin-top:3px;text-transform:uppercase;}
.pos-logout{background:none;border:1px solid rgba(200,169,110,0.3);color:var(--sand-light);padding:8px 16px;border-radius:2px;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;font-weight:600;}
.pos-logout:hover{border-color:var(--sand);color:var(--cream);}

.pos-search-wrap{padding:20px 24px 8px;background:var(--cream);position:sticky;top:65px;z-index:40;}
.pos-search{width:100%;background:#fff;border:1px solid var(--border);border-radius:3px;padding:14px 18px;font-size:14px;color:var(--text);outline:none;transition:border-color 0.2s;}
.pos-search:focus{border-color:var(--sand);}
.pos-search::placeholder{color:var(--gray-mid);}

.pos-body{flex:1;padding:16px 24px 40px;}
.pos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;}

.prod-card{background:#fff;border:1px solid var(--border);border-radius:4px;padding:18px;cursor:pointer;transition:all 0.2s;display:flex;flex-direction:column;gap:8px;}
.prod-card:hover{border-color:var(--sand);box-shadow:0 4px 16px rgba(58,46,34,0.08);transform:translateY(-2px);}
.prod-card .prod-emoji{font-size:30px;margin-bottom:2px;}
.prod-card .prod-nombre{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:600;color:var(--dark);line-height:1.3;}
.prod-card .prod-meta{font-size:11px;color:var(--gray);letter-spacing:0.02em;}
.prod-card .prod-precio{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:600;color:var(--sand);margin-top:4px;}
.prod-stock{display:inline-block;width:fit-content;font-size:9px;letter-spacing:0.1em;text-transform:uppercase;font-weight:700;padding:3px 9px;border-radius:100px;margin-top:2px;}
.prod-stock.ok{background:var(--success-bg);color:var(--success);}
.prod-stock.low{background:rgba(184,114,10,0.1);color:var(--warning);}
.prod-stock.out{background:var(--danger-bg);color:var(--danger);}

.empty-state{grid-column:1/-1;text-align:center;padding:80px 20px;color:var(--gray);}
.empty-state .icon{font-size:40px;margin-bottom:14px;opacity:0.5;}

/* ── MODAL DE VENTA ── */
.pos-modal-overlay{position:fixed;inset:0;background:rgba(26,21,16,0.55);display:none;align-items:center;justify-content:center;z-index:200;padding:20px;}
.pos-modal-overlay.open{display:flex;}
.pos-modal{background:#fff;border-radius:6px;width:100%;max-width:380px;padding:32px;text-align:center;animation:modalIn 0.2s ease;}
@keyframes modalIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.pos-modal .m-emoji{font-size:42px;margin-bottom:10px;}
.pos-modal .m-nombre{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:600;color:var(--dark);}
.pos-modal .m-meta{font-size:12px;color:var(--gray);margin-top:6px;letter-spacing:0.02em;}
.pos-modal .m-precio{font-family:'Cormorant Garamond',serif;font-size:38px;font-weight:700;color:var(--sand);margin:18px 0 22px;}
.qty-wrap{display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:24px;}
.qty-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--border-strong);background:var(--sand-pale);color:var(--dark);font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;}
.qty-btn:hover{background:var(--sand);color:#fff;}
.qty-val{font-size:20px;font-weight:700;min-width:30px;}
.m-total{font-size:12px;color:var(--gray);margin-bottom:20px;}
.m-total strong{color:var(--text);font-size:16px;}
.btn-confirm{width:100%;background:var(--success);color:#fff;padding:15px;border:none;border-radius:3px;font-size:11px;font-weight:700;letter-spacing:0.15em;text-transform:uppercase;transition:background 0.2s;}
.btn-confirm:hover{background:#3d6849;}
.btn-confirm:disabled{background:var(--gray-mid);cursor:not-allowed;}
.btn-cancel{width:100%;background:none;border:none;color:var(--gray);padding:12px;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;margin-top:6px;}
.btn-cancel:hover{color:var(--text);}

/* ── TOAST ── */
#toastEl{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--dark);color:var(--cream);padding:14px 26px;border-radius:4px;font-size:13px;font-weight:500;opacity:0;pointer-events:none;transition:all 0.3s;z-index:500;box-shadow:0 8px 24px rgba(0,0,0,0.25);border:1px solid rgba(200,169,110,0.25);}
#toastEl.show{opacity:1;transform:translateX(-50%) translateY(0);}

@media(max-width:480px){
  .pos-header,.pos-search-wrap,.pos-body{padding-left:16px;padding-right:16px;}
  .pos-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;}
  .prod-card{padding:14px;}
}
</style>
</head>
<body>

<!-- PANTALLA DE ACCESO -->
<div id="lockScreen">
  <div class="lock-logo">
    <h1>Oleaje</h1>
    <p>Punto de Venta</p>
  </div>
  <div class="lock-divider"></div>
  <div class="lock-box">
    <input class="pin-input" id="pinInput" type="password" inputmode="numeric" placeholder="• • • •" maxlength="8"/>
    <button class="pin-btn" onclick="tryUnlock()">Ingresar</button>
    <p class="pin-error" id="pinError">PIN incorrecto. Intenta de nuevo.</p>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="pos-header">
    <div class="pos-brand">
      <h1>Oleaje</h1>
      <p>Punto de Venta</p>
    </div>
    <button class="pos-logout" onclick="lockApp()">Salir</button>
  </div>

  <div class="pos-search-wrap">
    <input class="pos-search" id="searchInput" type="text" placeholder="🔍 Buscar por nombre o código..." oninput="renderCatalogo()"/>
  </div>

  <div class="pos-body">
    <div class="pos-grid" id="catalogGrid">
      <div class="empty-state"><div class="icon">⏳</div><p>Cargando catálogo...</p></div>
    </div>
  </div>
</div>

<!-- MODAL DE VENTA -->
<div class="pos-modal-overlay" id="modalOverlay">
  <div class="pos-modal">
    <div class="m-emoji" id="mEmoji">👗</div>
    <div class="m-nombre" id="mNombre">Producto</div>
    <div class="m-meta" id="mMeta">Talla · Color</div>
    <div class="m-precio" id="mPrecio">$0</div>
    <div class="qty-wrap">
      <button class="qty-btn" onclick="changeQty(-1)">−</button>
      <span class="qty-val" id="qtyVal">1</span>
      <button class="qty-btn" onclick="changeQty(1)">+</button>
    </div>
    <div class="m-total">Total a cobrar: <strong id="mTotal">$0</strong></div>
    <button class="btn-confirm" id="btnConfirm" onclick="confirmarVenta()">✅ Registrar Venta</button>
    <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
  </div>
</div>

<div id="toastEl"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-app.js";
import { getDatabase, ref, onValue, push, set, update } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-database.js";

const firebaseConfig = {apiKey:"AIzaSyCoBp2d5M2OcClIatLA4RqZx7vhCURqKdQ",authDomain:"oleaje-store.firebaseapp.com",projectId:"oleaje-store",storageBucket:"oleaje-store.firebasestorage.app",messagingSenderId:"253321516324",appId:"1:253321516324:web:92696cce481b5189e8fb1",databaseURL:"https://oleaje-store-default-rtdb.firebaseio.com"};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let catalogo = {};       // catalogoVentas (público: sin costo)
let asesoraPin = '';
let productoActivo = null; // {key, ...}
let qty = 1;

// Emojis por categoría (decorativo, sin necesidad de imágenes)
const EMOJI_MAP = {
  'vestido de baño':'👙','vestidos de baño':'👙','bikini':'👙',
  'vestido':'👗','vestidos':'👗',
  'camisa':'👕','camisas':'👕','blusa':'👚','blusas':'👚',
  'pantalon':'👖','pantalón':'👖','short':'🩳','shorts':'🩳',
  'zapato':'👠','zapatos':'👠','sandalia':'👡','sandalias':'👡',
  'accesorio':'💍','accesorios':'💍','bolso':'👜','bolsos':'👜',
};
function emojiFor(categoria){
  const c = (categoria||'').toLowerCase().trim();
  return EMOJI_MAP[c] || '🛍️';
}

function toast(msg){
  const el = document.getElementById('toastEl');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'), 2600);
}

// ── PIN ──
onValue(ref(db,'config/asesoraPin'), snap => {
  asesoraPin = snap.exists() ? String(snap.val()) : '';
});

window.tryUnlock = () => {
  const val = document.getElementById('pinInput').value.trim();
  const err = document.getElementById('pinError');
  if(!asesoraPin){ err.textContent='Aún no se ha configurado un PIN. Pide al administrador que lo cree en el panel.'; err.style.display='block'; return; }
  if(val === asesoraPin){
    document.getElementById('lockScreen').style.display='none';
    document.getElementById('app').style.display='flex';
    err.style.display='none';
  } else {
    err.textContent='PIN incorrecto. Intenta de nuevo.';
    err.style.display='block';
    document.getElementById('pinInput').value='';
  }
};
document.getElementById('pinInput').addEventListener('keydown', e=>{ if(e.key==='Enter') window.tryUnlock(); });

window.lockApp = () => {
  document.getElementById('app').style.display='none';
  document.getElementById('lockScreen').style.display='flex';
  document.getElementById('pinInput').value='';
};

// ── CATÁLOGO ──
onValue(ref(db,'catalogoVentas'), snap => {
  catalogo = snap.exists() ? snap.val() : {};
  renderCatalogo();
});

window.renderCatalogo = () => {
  const grid = document.getElementById('catalogGrid');
  const q = (document.getElementById('searchInput').value||'').toLowerCase().trim();
  let entries = Object.entries(catalogo).filter(([k,p])=>p.activo!==false);
  if(q) entries = entries.filter(([k,p])=>(p.nombre||'').toLowerCase().includes(q)||(p.codigo||'').toLowerCase().includes(q));
  entries.sort((a,b)=>(a[1].nombre||'').localeCompare(b[1].nombre||''));

  if(entries.length===0){
    grid.innerHTML = `<div class="empty-state"><div class="icon">📦</div><p>${Object.keys(catalogo).length===0?'Todavía no hay productos cargados.':'No se encontró ningún producto.'}</p></div>`;
    return;
  }

  grid.innerHTML = entries.map(([key,p])=>{
    const stock = p.stock||0;
    const stockClass = stock<=0?'out':stock<=3?'low':'ok';
    const stockLabel = stock<=0?'Agotado':stock<=3?`Últimas ${stock}`:'Disponible';
    return `<div class="prod-card" onclick="openModal('${key}')">
      <div class="prod-emoji">${emojiFor(p.categoria)}</div>
      <div class="prod-nombre">${p.nombre||'—'}</div>
      <div class="prod-meta">${[p.talla,p.color].filter(Boolean).join(' · ')||p.categoria||''}</div>
      <div class="prod-precio">${fmtCOP(p.precioVenta)}</div>
      <span class="prod-stock ${stockClass}">${stockLabel}</span>
    </div>`;
  }).join('');
};

function fmtCOP(n){ return '$' + Math.round(n||0).toLocaleString('es-CO'); }

// ── MODAL / VENTA ──
window.openModal = (key) => {
  const p = catalogo[key];
  if(!p || (p.stock||0)<=0){ toast('⚠️ Este producto está agotado'); return; }
  productoActivo = {key, ...p};
  qty = 1;
  document.getElementById('mEmoji').textContent = emojiFor(p.categoria);
  document.getElementById('mNombre').textContent = p.nombre||'—';
  document.getElementById('mMeta').textContent = [p.talla,p.color].filter(Boolean).join(' · ')||p.categoria||'—';
  document.getElementById('mPrecio').textContent = fmtCOP(p.precioVenta);
  updateQtyUI();
  document.getElementById('modalOverlay').classList.add('open');
};

window.closeModal = () => {
  document.getElementById('modalOverlay').classList.remove('open');
  productoActivo = null;
};

window.changeQty = (delta) => {
  if(!productoActivo) return;
  const max = productoActivo.stock||1;
  qty = Math.min(max, Math.max(1, qty+delta));
  updateQtyUI();
};

function updateQtyUI(){
  document.getElementById('qtyVal').textContent = qty;
  document.getElementById('mTotal').textContent = fmtCOP((productoActivo?.precioVenta||0)*qty);
  document.getElementById('btnConfirm').disabled = false;
}

window.confirmarVenta = async () => {
  if(!productoActivo) return;
  const btn = document.getElementById('btnConfirm');
  btn.disabled = true; btn.textContent = 'Registrando...';
  const { key, codigo, nombre, talla, color, precioVenta, stock } = productoActivo;
  const nuevoStock = Math.max(0, (stock||0) - qty);
  const hoy = new Date().toISOString().slice(0,10);
  try{
    await push(ref(db,'ventasFisicas'), {
      codigo, nombre, talla:talla||'', color:color||'',
      precioVenta, cantidad: qty, total: precioVenta*qty,
      fecha: hoy, ts: Date.now(), origen:'asesora'
    });
    await update(ref(db,`catalogoVentas/${key}`), {stock: nuevoStock});
    await update(ref(db,`inventarioFisico/${key}`), {stock: nuevoStock});
    toast('✅ Venta registrada. ¡Gracias!');
    closeModal();
  }catch(e){
    toast('❌ Error al registrar: '+e.message);
    btn.disabled = false; btn.textContent = '✅ Registrar Venta';
  }
};

document.getElementById('modalOverlay').addEventListener('click', e=>{
  if(e.target.id==='modalOverlay') closeModal();
});
</script>
</body>
</html>
